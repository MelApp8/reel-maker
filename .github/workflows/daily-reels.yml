# Makes new reels every day on GitHub's free servers and publishes them to your phone page
# (https://<your-github-name>.github.io/<repo-name>/). No computer needed.
name: Daily reels
on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC every day = 08:00 in India. Change to suit you.
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: make a reel about this topic instead of today's trends"
        required: false
permissions:
  contents: write      # saves a small preview of each day's reels to the "preview" branch
  pages: write
  id-token: write
  models: read         # free AI caption writing with GitHub Models
concurrency:
  group: daily-reels
  cancel-in-progress: false
jobs:
  make:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Bring back the last few days of reels
        uses: actions/cache/restore@v4
        with:
          path: output
          key: reels2-${{ github.run_id }}
          restore-keys: reels2-
      - name: Make reels
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRENDS_GEO: ${{ vars.TRENDS_GEO || 'US' }}
          REELS_PER_DAY: ${{ vars.REELS_PER_DAY || '3' }}
          HANDLE: ${{ vars.HANDLE }}
          TOPIC: ${{ inputs.topic }}
        run: |
          if [ -n "$TOPIC" ]; then python -m reelmaker make --topic "$TOPIC"; else python -m reelmaker make; fi
      - run: python -m reelmaker site --keep-days 7
      - uses: actions/cache/save@v4
        with:
          path: output
          key: reels2-${{ github.run_id }}
      - name: Save a preview (contact sheets + captions) to the preview branch
        continue-on-error: true
        run: |
          mkdir -p /tmp/preview
          ffmpeg=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          for d in output/$(date -u +%F)/*/; do
            name=$(basename "$d")
            "$ffmpeg" -v error -y -i "$d/reel.mp4" -vf "fps=1/3.5,scale=270:480,tile=6x1" -frames:v 1 "/tmp/preview/$name.jpg" || true
            cp "$d/post.txt" "/tmp/preview/$name.txt" || true
            cp "$d/meta.json" "/tmp/preview/$name.json" || true
          done
          cd /tmp/preview && git init -q -b preview && git add -A
          git -c user.name=reel-bot -c user.email=reel-bot@users.noreply.github.com commit -q -m "Preview $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
